name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate:
    # The test suite is the gate: hassfest runs the official validation, and a
    # merge that fails a test has not been validated at all. Pinned to a commit
    # SHA so `push` cannot silently change what validates, which is the mutable
    # default-branch pin this workflow carried before.
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3
