name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The test suite is the gate, so this workflow runs it rather than trusting
      # that some other workflow did. GitHub's `needs` cannot cross workflow
      # files, so a `needs: core` here names a job that does not exist in this
      # file and the workflow fails at validation — which is exactly what
      # happened the first time this release tried it.
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      # Pinned to a commit SHA rather than `master`, a mutable default-branch
      # ref that anyone who can push to that repository can repoint.
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3
