name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install black
      - run: python -m pytest
      - run: python -m black --check sentinel custom_components tests
      - run: python -m compileall -q sentinel custom_components tests
      - run: python -m json.tool hacs.json >/dev/null
      - run: python -m json.tool custom_components/jev_sentinel/manifest.json >/dev/null
      - run: git diff --check
