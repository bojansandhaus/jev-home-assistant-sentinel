name: HACS Validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate:
    # Depends on the test job, for the reason the hassfest workflow gives: a
    # release that has not passed its own tests is not a validated one.
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit SHA rather than `main`, which is a mutable ref.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
